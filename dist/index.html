кос начался, все в полях.","Колодец мелеет — лето сухое.","Мухи заели, спасу нет.","Ночи короткие, спать некогда.","Пыль на дорогах — столбом.","Лето — время работать, зима — вспоминать.","Дети с реки не вылезают.","Душно, к вечеру будет гроза."],[ut.Autumn]:["Листья желтеют, скоро холода.","Дожди зарядили, дороги раскисли.","Пора запасать дрова на зиму.","Урожай собрали — теперь можно и выдохнуть.","Осень, грибов в лесу — хоть косой коси.","Ветер какой — крыши сорвёт.","Гуси на юг потянулись.","Ночи уже холодные, печь топить пора.","Яблоки в этом году — крупные.","Туманы по утрам, хоть ножом режь.","Осень — пора свадеб.","Урожай убран, амбары полны.","Скоро первый снег, попомни моё слово.","Самое время квасить капусту."],[ut.Winter]:["Мороз-то какой! Уши отваливаются.","Снега намело по самые окна.","Реку льдом сковало.","Дрова кончаются, а зима только началась.","В такой холод и волки к стенам подходят.","Скорей бы весна.","Печь топи не топи — всё одно холодно.","Дети на льду катаются — как бы не провалились.","Зимой день короткий — не успеешь оглянуться.","Дорогу замело, караваны не пройдут.","Говорят, за лесом волки корову задрали.","Зима длинная, запасы тают.","Ночью звёзды — как гвозди.","Иней на бороде — вот и весь мой наряд."]},fe={rain:["Льёт как из ведра.","Дождь, дождь, когда он кончится?","Промокну до костей.","Дороги развезло — телега не проедет.","Хоть бы крыша не потекла.","В такой дождь и собака из конуры не вылезет.","Дождь полям на пользу, а нам — одна сырость.","Вода по улице ручьём бежит.","Сапоги промокли насквозь.","Под навесом переждём?"],storm:["Гроза идёт, прячься!","Молния в каланчу ударила, видел?","Гром такой — стёкла дрожат.","В грозу под деревом не стой.","Небо чёрное, как сажа.","Господи, спаси от молнии!","Ветер крышу с сарая сорвал.","Дети от грома под лавку забились."],snow:["Снег валит хлопьями.","Сугробы по пояс.","Дорогу опять замело.","Снег скрипит — к морозу.","Крышу бы от снега почистить.","Красиво, но холодно.","Детвора в снежки играет.","Снег идёт — зима настоящая."],fog:["Туман — руки своей не видно.","В таком тумане и дом не найдёшь.","Из тумана кто-то вышел — думал, привидение.","Туман с реки ползёт.","Сыро и серо.","В туман воры шалят, осторожней.","Хоть ножом туман режь.","Ничего не видать, иду наощупь."],wind:["Ветер с ног сбивает.","Ставни хлопают всю ночь.","Ветер, аж свистит в ушах.","С крыш солому срывает.","Шапку держи, унесёт!","Ветрено — пожар бы не случился.","Мельнице такой ветер в радость.","Пыль в глаза — не продерёшь."],heat:["Жарища, как в кузне.","Ни ветерка.","Пить хочется — умираю.","В тени и то дышать нечем.","Солнце голову напекло.","Хоть бы облачко.","К реке бы, окунуться.","Собаки языки повысовывали."],frost:["Мороз трещит.","Щёки отморозишь.","Птицы на лету мёрзнут.","Вода в колодце льдом взялась.","Шубу бы потеплее.","Дыхание в бороде замерзает.","В такой мороз только у печи сидеть.","Ноги не чувствую."],nice:["Погода — загляденье.","Денёк сегодня хорош.","Солнышко, тепло — красота.","В такую погоду и работать веселее.","Хороший день, грех жаловаться.","Благодать!","Погода как по заказу.","Ясно, тихо — душа радуется."]},Yl=["И не говори.","Да, погода — не позавидуешь.","Бывало и похуже.","Такая уж пора.","Что поделаешь, всё от Бога.","К вечеру переменится.","Старики говорят — к перемене.","Да, год какой-то странный.","Главное — крыша над головой.","А мне нравится.","Привыкли уже.","Поля-то как, ничего?","Лишь бы урожай не побило.","Переживём, не впервой.","Это ещё что! Помнишь прошлый год?","Кости ноют — значит, надолго.","Хоть бы дрова не кончились.","Да, ветер прямо с реки.","Я ещё утром почуял.","Зато комаров нет."],Bl={[v.Farmer]:["Поле вспахал, спина отваливается.","Если дождей не будет — пропадёт урожай.","Землю надо любить, тогда и родит.","В поле с рассвета до заката.","Лорд опять оброк поднял.","Зерно на мельницу отвёз — мельник ворчит.","Сорняки, как ни полоть, прут.","Волы совсем старые, а новых не купить.","Хороший год — и амбар полон.","Крестьянский труд — он всех кормит, а кто скажет спасибо?"],[v.Baker]:["С четырёх утра у печи стою.","Мука нынче дорогая.","Хлеб разобрали ещё до полудня!","Руки по локоть в тесте.","Пекарня — это не лавка, тут вставать затемно.","Печь надо чинить, тяга плохая.","Дров на выпечку уходит — страсть.","Свежий хлеб пахнет лучше любых духов.","Мельник муку сырую привёз, опять.","Кто хлеб печёт — тот город кормит."],[v.Smith]:["Заказов — на месяц вперёд.","Уголь опять подорожал.","Выковал сегодня подкову — загляденье.","От горна спина не разгибается.","Стража просит новые алебарды.","Железо нынче плохое, крошится.","Молот тяжёл, зато руки крепкие.","Подмастерье опять заготовку запорол.","Топоры лесорубам — моя главная работа.","Кузнец без огня — как рыба без воды."],[v.Guard]:["Ночью на восточной стене было тихо.","Воры совсем распоясались.","Капитан опять ругался.","Патрулирую, патрулирую — а толку.","Смотри у меня, чтоб без драк!","В трущобах опять неспокойно.","Жалованье задерживают.","Алебарда тяжёлая, а ходить целый день.","Поймали вчера одного у рынка.","Порядок сам себя не наведёт."],[v.Merchant]:["Торговля идёт ни шатко ни валко.","Караван обещали на той неделе.","Пошлины душат, честное слово.","Покупатель нынче жадный.","Хороший товар сам себя хвалит.","За рекой платят вдвое, да везти далеко.","Склад забит, а брать некому.","Купец без дороги — не купец.","Торговаться — целое искусство.","Монета к монете — так и дом строится."],[v.Innkeeper]:["Вчера в таверне яблоку негде было упасть.","Эль закончился — варю новый.","Пьяные — беда, но платят.","Заходи вечером, спою за кружкой.","Зерна на эль не хватает.","Кружки бьют, лавки ломают — а всё равно люблю своё дело.","Стража вчера дебошира увела.","Бард поёт — выручка вдвое.","Хочешь узнать новости — приходи в таверну.","Хозяин таверны знает всё обо всех."],[v.Priest]:["Паства нынче редко ходит в собор.","Молись, и воздастся.","Грехов в городе много, а кающихся мало.","На службу приходи, сын мой.","Свечи в соборе догорают — пожертвуй на новые.","Венчал вчера молодых — славная пара.","Колокол треснул, нужен новый.","Господь терпелив, но не вечно.","Исповедь облегчает душу.","Соборные своды помнят три поколения."],[v.Monk]:["В больнице опять двое с лихорадкой.","Травы собрал, настой готовлю.","Господь исцеляет, мы лишь помогаем.","Больных прибавилось, коек не хватает.","Отвар из коры помогает от жара.","Молитва и чистота — лучшие лекари.","Ночами дежурю у больных.","Монастырский сад даёт целебные травы.","Принесите хворого — поставим на ноги.","Пост и труд — вот наша жизнь."],[v.Carpenter]:["Доски сырые — крыша потечёт.","Заказали новую дверь для ратуши.","Плотник без топора — не плотник.","Стропила ставлю на новом доме.","Лесопилка досок не успевает давать.","Хорошее дерево — полдела.","Руки в занозах, зато дом стоит.","Стройка кипит, работы хватает.","Пила затупилась, точить надо.","Что построено с душой — стоит сто лет."],[v.Mason]:["Камень из каменоломни — отличный.","Стена у ворот трещину дала.","Кладка — дело неторопливое.","Раствор застывает — поспешишь, переделаешь.","Каменный дом пожара не боится.","Спина от камней болит.","Собор ещё мой дед клал.","Камня на стройку мало везут.","Каменщик строит на века.","Фундамент — главное в доме."],[v.Tanner]:["От кожевни запах — соседи ругаются.","Шкуры вымачиваю, работа грязная.","Зато сапоги у всех мои.","Мясник шкур мало даёт.","Кожа вышла мягкая, как шёлк.","Руки от дубильни чёрные.","Без кожи ни сапог, ни сбруи.","Ремесло вонючее, да прибыльное.","Дубовую кору собираю для дубления.","Кожевника по запаху узнают."],[v.Woodcutter]:["В лесу волки воют.","Сосну свалил — трое не обхватят.","Топор затупился, к кузнецу надо.","Брёвна на лесопилку возим.","Лес редеет, далеко ходить приходится.","В лесу тихо, только дятел стучит.","Чуть деревом не придавило.","Дрова городу нужны, зима близко.","С топором всю жизнь, как отец.","В чаще медведя видел."],[v.Quarryman]:["В каменоломне пыль столбом.","Камень тяжёлый, а платят мало.","Чуть глыбой не придавило.","Кирка сломалась, новую бы.","Каменщики торопят — камня им подавай.","Руки в мозолях.","Глубоко уже вкопались.","В каменоломне эхо, как в соборе.","Камень ломать — не репу сажать.","Хорошая жила пошла."],[v.Miller]:["Колесо крутится, мука сыплется.","Река обмелела — мельница еле тянет.","Зерно везут с полей, работы много.","Жернова стёрлись, менять пора.","Мучная пыль — всё белое.","Пекарь ворчит, что мука сырая.","Крестьяне очередь к мельнице выстроили.","Мельник всегда в муке, как в снегу.","Без мельницы хлеба не будет.","Плотину бы подправить."],[v.Butcher]:["Свежая свинина, заходи.","Скот нынче тощий.","Нож наточил — режет как бритва.","Шкуры кожевнику отдал.","Мясо дорожает, а что делать.","Крестьяне скот не везут.","В жару мясо не лежит.","Колбасу новую сделал — попробуй.","Мясник без ножа — как стражник без алебарды.","Собаки у лавки крутятся."],[v.Burgomaster]:["Дела городские — одна головная боль.","Казна пустеет, а расходы растут.","Лорд требует отчёта.","Жалобы, жалобы, одни жалобы.","Суд вчера до ночи заседал.","Мост чинить надо, а денег нет.","Стражу содержать — целое состояние.","Город растёт, забот прибавляется.","Бургомистр — слуга города, не хозяин.","Купцы просят пошлины снизить."],[v.Herald]:["Слушайте, слушайте! Новости будут.","Голос сорвал на площади.","Указ оглашать — это тебе не песни петь.","Новый указ зачитывал — народ ворчал.","Глашатай всё знает первым.","Горло мёдом смазываю.","На площади с утра — кричу.","Если я молчу — значит, новостей нет.","Бургомистр бумагу дал — читать не разобрать.","Слушайте все!"],[v.Servant]:["Господа опять не в духе.","С утра до ночи на побегушках.","В замке полы мыть — дело неблагодарное.","Лорд гостей ждёт — всё вверх дном.","Жалованье платят, и на том спасибо.","Кухарка опять ругалась.","В замке тепло, не то что дома.","Слуга всё видит, да молчит.","Серебро чистить — руки отваливаются.","Госпожа платье новое велела шить."],[v.Laborer]:["Мешки таскаю, спина трещит.","Хоть какая работа — и то хлеб.","Нанялся на день, а завтра — как Бог даст.","На стройке платят, пока строят.","Подёнщик — ни дома, ни ремесла.","Взяли бы меня в цех.","Сегодня брёвна, завтра камни.","Работы много, да платят мало.","Руки есть — не пропадём.","Купец вчера нанимал — повезло."],[v.Beggar]:["Подайте, люди добрые…","С утра ни крошки во рту.","Был и я когда-то человеком.","Монетку, ради Бога.","Ночевал под мостом, холодно.","Стража гонит с площади.","Добрые люди ещё есть.","Хлеба бы корочку.","Был дом, был двор — всё сгорело.","Нищему и дождь — беда."],[v.Thief]:["Дела? Да так, кручусь.","Стража сегодня злая.","Не твоё дело, чем я занимаюсь.","Ночью спится плохо, хожу.","Деньги любят тишину.","У кого кошель тяжёлый, у того и забот больше.","Я человек честный, когда никто не видит.","Хм, у тебя кошель на виду.","Воров в городе нет — одни бедняки.","Что упало — то пропало."],[v.Noble]:["Эти простолюдины так шумят.","На охоте вчера подняли кабана.","При дворе скучно.","Моя родословная старше этого города.","Прислуга совсем обленилась.","Лорд обещал турнир.","Вино из-за реки — вот это вино.","Эта грязь на улицах невыносима.","Сокол мой лучший в округе.","Бал у лорда был недурён."],[v.Lord]:["Город должен платить вовремя.","Я слежу за порядком.","Стража распустилась.","Бургомистр опять с докладом.","Замок требует ремонта.","Подданные должны знать своё место.","Налоги — цена безопасности.","Праздник устрою — пусть народ помнит.","Соседний барон зарится на наши земли.","Тяжела рука, что держит город."],[v.Housewife]:["Дома дел — не переделать.","Дети совсем от рук отбились.","Хлеб опять подорожал.","Муж допоздна работает.","Стирка, готовка, уборка — и так каждый день.","Соседка новый платок купила.","Печь дымит, надо мужу сказать.","Малой заболел, всю ночь не спала.","На рынок сходила — всё дорого.","Дом держится на хозяйке."],[v.Bard]:["Сочинил новую балладу про дракона.","В таверне вчера пели до утра.","Хочешь, спою?","Струна лопнула — беда.","Песня про лорда ему не понравилась.","Народ любит грустные песни.","Голос — мой хлеб.","Бард без публики — как кузнец без наковальни.","Новую песню про {city} сложил.","За песню и накормят, и напоят."],[v.Stablehand]:["Лошадь лорда захромала.","Конюшню чистить — не сахар.","Овёс дорогой, кони голодные.","Жеребёнок родился — красавец.","Купцы коней меняют у нас.","Лошадь умнее иного человека.","Сено на зиму заготовил.","Кузнец подковы обещал.","Конь лорда — зверь, не подступись.","С лошадьми легче, чем с людьми."],[v.Fireman]:["Проверяй печь, а то сгорим все.","Вёдра на каланче полны.","С каланчи весь город видно.","Соломенные крыши — беда.","Ночью дым видел — обошлось.","В ветер глаз не сомкну.","Колокол на каланче — на случай пожара.","Пожарному сон — роскошь.","Кузня — вечная опасность.","Город горит быстро, а строится долго."],[v.Elder]:["Годы не те, чтобы работать.","Сижу на лавке, смотрю на молодых.","Отработал своё.","Внуков нянчу — вот и работа.","Кости ноют к дождю.","Старость — не радость.","Помню, как всё начиналось.","Молодёжь торопится, а куда?","Солнышко греет — и ладно.","День прожит — и слава Богу."],[v.None]:["Работу ищу.","Без дела сижу, тошно.","В цех не берут — чужак.","Хоть бы кто нанял.","Руки есть, а работы нет.","На рынке, говорят, грузчики нужны.","Деньги кончаются.","Пойду к купцу проситься.","Без работы и день длинный.","Кто без дела — тот и без хлеба."]},Gl=["Работа — не волк, но и не убежит.","Устал как собака.","Дела идут помаленьку.","Работы много, денег мало.","Вот закончу — и в таверну.","Хозяин доволен — и я доволен.","С утра до вечера, и так всю жизнь.","Ремесло кормит.","Руки помнят, что голова забыла.","Работа есть — и слава Богу."],Xl=["Да, работа у тебя не сахар.","Зато ремесло в руках.","У всех так, {name}.","Хозяину скажи, пусть доплатит.","Терпи, казак.","А я думал, у тебя легко.","Без работы хуже.","Отдохни хоть в праздник.","Ты мастер, тебе и карты в руки.","Слыхал, в {work} неплохо платят.","Эх, мне бы твои заботы.","Трудишься — честь тебе.","А у нас в цехе то же самое.","Н },nc=["Какой сегодня чудесный день, {name}…","Я тебе цветы принёс.","Ты сегодня особенно хороша.","Может, прогуляемся до реки?","У тебя глаза как весеннее небо.","Давно хотел с тобой поговорить, {name}.","Ты не замужем, я слышал?","Я бы тебе дом построил.","На празднике потанцуем?","Твой смех слышно через всю площадь.","Я каждый день мимо твоего дома хожу.","Красивее тебя в {city} нет.","Моя мать хочет с тобой познакомиться.","Я на тебя в соборе смотрел.","Вечером у колодца буду ждать.","Ты как солнышко.","Давай встречаться, {name}.","Ради тебя я бы на дракона пошёл.","С тобой и зима не страшна.","Я серьёзно, {name}."],Ts=["Ах, перестань…","Ну и выдумщик!","Может, и прогуляемся.","Мама не велит с тобой говорить.","Приходи вечером к колодцу.","Ты всем это говоришь?","Болтун ты, {name}.","Ладно, посмотрим.","А цветы где?","Я подумаю.","Не так быстро.","Говори, говори.","Красиво говоришь.","Отец тебя и на порог не пустит.","Мне нравится, как ты это говоришь.","Покраснела, да?","Хм, может быть.","Ты мне тоже нравишься.","Сначала дом построй.","Увидимся на празднике."],oc=["Моя {spouse} — лучшее, что со мной случилось.","Женат, и счастлив.","Свадьбу помню как вчера.","Поженились — и ни разу не пожалел{a}.","Муж говорит — я его счастье.","Семейная жизнь — это труд.","С {spouse} и беда не беда.","Детей бы ещё.","Годовщина скоро.","Сватались долго, а поженились быстро."],sc=["Давай в догонялки!","А я видел в реке огромную рыбу!","Мама не разрешает к реке ходить.","У кузнеца искры летят — страшно!","Пошли на стену залезем!","Я вырасту и стану стражником!","А у меня зуб выпал!","Спорим, я быстрее добегу?","А ты видел дракона? Я видел!","Пекарь дал мне корочку!","Давай в прятки!","Я умею свистеть, слушай!","У меня братик родился!","Отец сказал, что я буду кузнецом.","А у стражника настоящий меч!","Пойдём лягушек ловить!","Я нашёл монетку!","Мне мама пирог испекла.","Бард рассказывал про великана!","В лесу живёт медведь, честно!","Я не боюсь темноты. Почти.","Давай построим крепость!","Моя сестра — ябеда.","Смотри, какой жук!","А я умею на дерево лазить!","Собака за мной бежала!","У нас дома котёнок.","Когда вырасту — куплю коня.","Я видел, как стражник вора поймал!","Побежали на площадь, там глашатай!"],rc=["Давай!","Врёшь!","А я нет!","Я первый!","Не верю!","Покажи!","А мне мама не разрешает.","Здорово!","Ух ты!","Пошли!","Я тоже хочу!","Ябеда!"],zs=["Ты чего тут один, {name}?","Иди домой, мать ищет.","Расти большой, не будь лапшой.","Держи, малыш.","Не лезь на стену, упадёшь!","Чей ты, мальчик?","Отцу помогаешь?","Вырастешь — в цех возьму.","Не балуйся у реки.","Хочешь сказку?"],ac=["Дяденька, а вы стражник?","А правда, что дракон был?","Мама дома!","Я не балуюсь!","Дайте корочку!","А вы кузнец? Покажите молот!","Я уже большой!","Я никуда не лезу!","Расскажите сказку!","А я видел вора!"],lc=["В наше время молодёжь уважала старших.","Зима будет суровая, кости ноют.","Я ещё помню, как эту стену строили.","Раньше и хлеб был вкуснее.","Доживёшь до моих лет — поймёшь.","Старого лорда помню — строг был.","В молодости я за реку ходил.","Собор при мне достроили.","Молодёжь нынче не та.","Мы в ваши годы с рассвета работали.","Помню голодный год — вот где страх был.","Внуки выросли, а я всё тут.","Сиди со мной, расскажу.","Кто помнит старый мост? Я помню.","Время летит, как ласточка.","На лавке у ворот — лучшее место в городе.","Старые песни забыли, жаль.","Я ещё первого бургомистра знал.","Дожить бы до весны.","Главное в жизни — не спешить."],cc=["Расскажи, дед.","Да, времена меняются.","Живи долго, {name}.","Мудрый ты человек.","Вот и мой отец так говорил.","А сейчас-то лучше, нет?","Расскажешь внукам.","Здоровья тебе."],dc=["Говорят, под собором клад зарыт — ещё с тех пор, как город основали.","Слыхал про Чёрного Мельника? Молол по ночам, а муки никто не видел.","В лесу за рекой живёт старуха — к ней за травами ходят, да не все возвращаются.","Рассказывают, лорд однажды переоделся нищим и ходил по рынку.","Дед мой говорил: когда колокол сам звонит — быть беде.","За каменоломней пещера есть, а в ней — дракон спит. Тот самый.","Жил в {city} кузнец, что подковал самого чёрта. С тех пор у чёрта хромота.","Старый мост, говорят, строили на костях разбойников.","Однажды река ушла из берегов и унесла целую улицу — до сих пор камни на дне.","У ворот стоял стражник сорок лет и ни разу не уснул. Умер стоя.","Говорят, в колодце на площади живёт водяной — не пей после заката.","Был пекарь, что пёк хлеб из золота. Богачи ели, а бедные смотрели.","В подвале ратуши, говорят, дверь без ключа. Кто откроет — увидит будущее.","Белая дама ходит по стене в полнолуние — ищет своего жениха.","Старики говорят: первый снег выпадет на крышу собора — зима будет мягкой.","Мой прадед видел, как с неба упал камень — с тех пор тут каменоломня.","Рассказывают, бард проиграл голос в кости, а потом отыграл обратно.","Жил-был купец, что продал тень. Богател, богател, а тени нет — солнца боялся.","Монахи говорят: кто в праздник работает — у того топор сам из рук падает.","В трущобах, говорят, ходит вор, которого никто не видел. Может, и нет его.","Когда город основали, первый камень заложил простой каменщик, а не лорд.","Есть поверье: кто в день свадьбы увидит ворону — проживёт с женой до ста лет.","За рекой, говорят, деревня, где все говорят шёпотом — чтобы зверя не разбудить.","Говорят, собачий вой у замка — к смене лорда."],fc=["Враки это всё.","А я верю.","Бабушка так же рассказывала.","Расскажи ещё!","Страшно-то как.","Поди проверь.","Хорошая сказка.","Это ты сам выдумал?","Детям расскажу.","Кто знает, кто знает…"],hc=["Спрашивают пекаря: отчего хлеб чёрствый? А он: зато долго хранится!","Стражник вора поймал: «Ты зачем крал?» — «Так не давали же!»","Мельник говорит: у меня всё белое. Жена: кроме совести.","Кузнец жене: ты мне как наковальня. — Это как? — Всю жизнь бью, а ты ни с места!","Купец: «Товар бесплатный!» — «А это что?» — «А это плата за бесплатно.»","Священник: «Пьянство — грех!» Пьяница: «Так я ж каюсь каждое утро!»","Нищий: «Подайте на хлеб!» — «А вчера на эль просил.» — «Так закусить надо!»","Лорд: «Я вас всех кормлю!» Крестьянин: «А кто кормит вас, ваша милость?»","Жена мужу: «Опять из таверны?» — «Нет, в таверну. Просто домой зашёл.»","Стражник: «Кто идёт?» — «Свои!» — «Свои дома сидят!»","Бард спел лорду песню. Лорд: «Сколько тебе за неё?» — «Чтобы не пел — вдвое.»","Кожевник говорит: от меня пахнет деньгами. Соседи: тогда у тебя очень старые деньги.","Монах: «Пост — для души.» Нищий: «А у меня круглый год пост, а душа всё равно болит.»","Мясник взвешивает: «Полфунта.» — «А с пальцем?» — «Палец бесплатно.»","Плотник: «Стол прослужит сто лет!» — «А гарантия?» — «Приходите через сто лет.»","Каменщик: «Дом вечный!» Заказчик: «А крыша?» — «Крыша — к плотнику.»","Муж: «Я — голова семьи!» Жена: «А я шея. Куда поверну — туда и смотришь.»","Глашатай кричит: «Все на площадь!» — «Зачем?» — «Чтоб я не зря кричал!»","Бургомистр: «Налоги на благо города!» — «А город где?» — «В казне!»","Пекарь: «Хлеб свежий!» — «А вчерашний?» — «Тоже свежий. Вчера был.»","Крестьянин вола продал: «Умный был, пахал как человек.» — «Что ж продал?» — «Говорить начал.»","Стражника спрашивают: «Много воров поймал?» — «Одного. Себя в зеркале.»","Трактирщик: «Эль наш — вода!» — «Как вода?!» — «Прозрачный, как вода. И честный.»","Монах лечит: «Пей отвар три раза в день.» — «А поможет?» — «Три раза в день будешь думать, что поможет.»","Нищий нищему: «Плохо подают.» — «Так сезон такой.» — «Какой?» — «Все нищие.»","Вор: «Я честный вор! Краду только у богатых.» — «Почему?» — «У бедных нечего.»","Жена кузнеца: «Муж — золото!» — «Почему?» — «Весь день в огне, а не плавится.»","Лорд спрашивает: «Народ доволен?» — «Молчит.» — «Значит, доволен.» — «Или спит.»","Герольд читает указ: «Налог отменить!» Народ ликует. Герольд: «Ой, не ту бумагу взял.»","Священник: «На небесах нет таверн.» Пьяница: «Тогда зачем туда стремиться?»"],uc=["Ха-ха-ха!","Ну ты даёшь!","Хорошая!","Ой, не могу!","Расскажу жене.","Слышал уже.","Ха! Смешно.",
