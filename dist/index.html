нять пора.","Мучная пыль — всё белое.","Пекарь ворчит, что мука сырая.","Крестьяне очередь к мельнице выстроили.","Мельник всегда в муке, как в снегу.","Без мельницы хлеба не будет.","Плотину бы подправить."],[w.Butcher]:["Свежая свинина, заходи.","Скот нынче тощий.","Нож наточил — режет как бритва.","Шкуры кожевнику отдал.","Мясо дорожает, а что делать.","Крестьяне скот не везут.","В жару мясо не лежит.","Колбасу новую сделал — попробуй.","Мясник без ножа — как стражник без алебарды.","Собаки у лавки крутятся."],[w.Burgomaster]:["Дела городские — одна головная боль.","Казна пустеет, а расходы растут.","Лорд требует отчёта.","Жалобы, жалобы, одни жалобы.","Суд вчера до ночи заседал.","Мост чинить надо, а денег нет.","Стражу содержать — целое состояние.","Город растёт, забот прибавляется.","Бургомистр — слуга города, не хозяин.","Купцы просят пошлины снизить."],[w.Herald]:["Слушайте, слушайте! Новости будут.","Голос сорвал на площади.","Указ оглашать — это тебе не песни петь.","Новый указ зачитывал — народ ворчал.","Глашатай всё знает первым.","Горло мёдом смазываю.","На площади с утра — кричу.","Если я молчу — значит, новостей нет.","Бургомистр бумагу дал — читать не разобрать.","Слушайте все!"],[w.Servant]:["Господа опять не в духе.","С утра до ночи на побегушках.","В замке полы мыть — дело неблагодарное.","Лорд гостей ждёт — всё вверх дном.","Жалованье платят, и на том спасибо.","Кухарка опять ругалась.","В замке тепло, не то что дома.","Слуга всё видит, да молчит.","Серебро чистить — руки отваливаются.","Госпожа платье новое велела шить."],[w.Laborer]:["Мешки таскаю, спина трещит.","Хоть какая работа — и то хлеб.","Нанялся на день, а завтра — как Бог даст.","На стройке платят, пока строят.","Подёнщик — ни дома, ни ремесла.","Взяли бы меня в цех.","Сегодня брёвна, завтра камни.","Работы много, да платят мало.","Руки есть — не пропадём.","Купец вчера нанимал — повезло."],[w.Beggar]:["Подайте, люди добрые…","С утра ни крошки во рту.","Был и я когда-то человеком.","Монетку, ради Бога.","Ночевал под мостом, холодно.","Стража гонит с площади.","Добрые люди ещё есть.","Хлеба бы корочку.","Был дом, был двор — всё сгорело.","Нищему и дождь — беда."],[w.Thief]:["Дела? Да так, кручусь.","Стража сегодня злая.","Не твоё дело, чем я занимаюсь.","Ночью спится плохо, хожу.","Деньги любят тишину.","У кого кошель тяжёлый, у того и забот больше.","Я человек честный, когда никто не видит.","Хм, у тебя кошель на виду.","Воров в городе нет — одни бедняки.","Что упало — то пропало."],[w.Noble]:["Эти простолюдины так шумят.","На охоте вчера подняли кабана.","При дворе скучно.","Моя родословная старше этого города.","Прислуга совсем обленилась.","Лорд обещал турнир.","Вино из-за реки — вот это вино.","Эта грязь на улицах невыносима.","Сокол мой лучший в округе.","Бал у лорда был недурён."],[w.Lord]:["Город должен платить вовремя.","Я слежу за порядком.","Стража распустилась.","Бургомистр опять с докладом.","Замок требует ремонта.","Подданные должны знать своё место.","Налоги — цена безопасности.","Праздник устрою — пусть народ помнит.","Соседний барон зарится на наши земли.","Тяжела рука, что держит город."],[w.Housewife]:["Дома дел — не переделать.","Дети совсем от рук отбились.","Хлеб опять подорожал.","Муж допоздна работает.","Стирка, готовка, уборка — и так каждый день.","Соседка новый платок купила.","Печь дымит, надо мужу сказать.","Малой заболел, всю ночь не спала.","На рынок сходила — всё дорого.","Дом держится на хозяйке."],[w.Bard]:["Сочинил новую балладу про дракона.","В таверне вчера пели до утра.","Хочешь, спою?","Струна лопнула — беда.","Песня про лорда ему не понравилась.","Народ любит грустные песни.","Голос — мой хлеб.","Бард без публики — как кузнец без наковальни.","Новую песню про {city} сложил.","За песню и накормят, и напоят."],[w.Stablehand]:["Лошадь лорда захромала.","Конюшню чистить — не сахар.","Овёс дорогой, кони голодные.","Жеребёнок родился — красавец.","Купцы коней меняют у нас.","Лошадь умнее иного человека.","Сено на зиму заготовил.","Кузнец подковы обещал.","Конь лорда — зверь, не подступись.","С лошадьми легче, чем с людьми."],[w.Fireman]:["Проверяй печь, а то сгорим все.","Вёдра на каланче полны.","С каланчи весь город видно.","Соломенные крыши — беда.","Ночью дым видел — обошлось.","В ветер глаз не сомкну.","Колокол на каланче — на случай пожара.","Пожарному сон — роскошь.","Кузня — вечная опасность.","Город горит быстро, а строится долго."],[w.Elder]:["Годы не те, чтобы работать.","Сижу на лавке, смотрю на молодых.","Отработал своё.","Внуков нянчу — вот и работа.","Кости ноют к дождю.","Старость — не радость.","Помню, как всё начиналось.","Молодёжь торопится, а куда?","Солнышко греет — и ладно.","День прожит — и слава Богу."],[w.None]:["Работу ищу.","Без дела сижу, тошно.","В цех не берут — чужак.","Хоть бы кто нанял.","Руки есть, а работы нет.","На рынке, говорят, грузчики нужны.","Деньги кончаются.","Пойду к купцу проситься.","Без работы и день длинный.","Кто без дела — тот и без хлеба."]},wl=["Работа — не волк, но и не убежит.","Устал как собака.","Дела идут помаленьку.","Работы много, денег мало.","Вот закончу — и в таверну.","Хозяин доволен — и я доволен.","С утра до вечера, и так всю жизнь.","Ремесло кормит.","Руки помнят, что голова забыла.","Работа есть — и слава Богу."],vl=["Да, работа у тебя не сахар.","Зато ремесло в руках.","У всех так, {name}.","Хозяину скажи, пусть доплатит.","Терпи, казак.","А я думал, у тебя легко.","Без работы хуже.","Отдохни хоть в праздник.","Ты мастер, тебе и карты в руки.","Слыхал, в {work} неплохо платят.","Эх, мне бы твои заботы.","Трудишься — честь тебе.","А у нас в цехе то же самое.","Не надорвись.","Хорошо, что хоть работа есть.","Зайду к тебе, закажу кое-что.","Лорд бы послушал тебя.","Так и живём.","Каждому своё.","Пусть руки не знают покоя, а душа — тревоги."],de={poor:["Урожай в этом году — слёзы одни.","Зерна мало, зимой голодать будем.","Поля градом побило, что собрали — то и наше.","Такого неурожая старики не помнят.","Хлеб подорожает, вот увидишь.","Амбары пустые стоят.","Крестьяне за головы хватаются.","Муки на зиму не хватит."],normal:["Урожай как урожай, с голоду не помрём.","Собрали — как в прошлом году.","Зерно есть, хлеб будет.","Поля дали своё.","Крестьяне довольны, и ладно.","Среднего урожая на зиму хватит.","Ни богато, ни бедно.","Хлеба до весны достанет."],rich:["Урожай — амбары ломятся!","Такого зерна давно не было.","Колос к колосу, зерно к зерну.","Мельница день и ночь молотит.","Хлеб подешевеет, помяни моё слово.","Крестьяне на радостях пируют.","Щедрый год, благословенный.","Зерна столько, что за реку повезут."],season:["Сев идёт, всё в полях.","Всходы хорошие.","Жатва на носу.","Жнут с утра до ночи.","Поля убраны, теперь молотьба.","Земля под снегом отдыхает.","До новой жатвы ещё дожить надо.","Озимые посеяли."]},xl=["Да, год такой.","Лишь бы цены не взлетели.","Бог даст, перезимуем.","На всё воля Божья.","Крестьянам тяжелее всех.","Зерно надо беречь.","Купцы за рекой закупят, если что.","Хоть что-то хорошее.","Пекарь обрадуется.","Запасай, пока дёшево."],Ml=["Хлеб нынче по {bread}, куда это годится!","Эль в таверне — {ale}. Терпимо.","За {meal} монеты в таверне кормят до отвала.","Говорят, цены на муку растут.","На рынке всё дорожает, а жалованье то же.","Раньше за монету два каравая давали.","Мясо по {meat} — не укупишь.","Пекарь дерёт три шкуры.","Хлеб по {bread} — ещё терпимо.","Инструменты у кузнеца — не подступишься.","Доски подорожали, стройка встала.","Купцы цены ломят, как хотят.","Зерно по весне всегда дороже.","Эль по {ale} — пить можно.","Кожевник за сапоги просит как за коня.","Дрова по зиме на вес золота.","На рынке хлеба нет — пекарь не успевает.","За мясо {meat} — ну его, одним хлебом проживу.","Цены скачут, как блохи.","В торговом ряду дешевле, чем у пекаря.","Караван придёт — цены упадут.","Мука дешевле хлеба, сам пеки.","Деньги тают, как снег.","Жалованье {wage}, а хлеб {bread} — считай сам.","Говорят, за рекой хлеб вдвое дешевле.","Склад скупает всё подряд.","Пекарня у площади дороже, чем в ремесленном.","Зерно крестьяне придерживают — ждут цены.","Торговцы на площади — грабители.","За {meal} монеты — обед в таверне. Дороговато."],Sl=["И не говори, всё дорожает.","Бургомистр должен цены держать.","Так всегда перед зимой.","Это ещё дёшево!","Деньги — вода.","Зато у кузнеца подешевело.","Надо на рынок пораньше ходить.","У кого есть деньги — тому всё равно.","Караван привезёт — подешевеет.","Подать бы снизили — легче бы стало.","Я на хлеб уже не смотрю.","Сам пеку, дешевле.","Урожай будет — цена упадёт.","Торговцы — народ хитрый."],Ye={spouse:["Жена опять ворчит.","Муж всё по тавернам.","Дома ждут, пойду.","Мы с {spouse} поженились в такую же весну.","Моя половина готовит лучше всех в городе.","{spouse} сегодня не в духе.","С {spouse} уже который год — и не надоело.","Жена платок новый просит.","Муж обещал печь починить — всё обещает.","Вчера с {spouse} поругались, помирились.","Семья — это главное.","Домой спешу, {spouse} ждёт.","Хорошо, когда дома тебя ждут.","Моя {spouse} — золото."],kids:["Дети растут — одежда мала.","Сын весь в отца.","Дочка уже хозяйке помогает.","Детвора весь день на площади.","Малой опять порвал штаны.","Сыну пора ремеслу учиться.","Дочь на выданье, женихов нет.","Дети — одни заботы, зато радость.","Старший уже отцу помогает.","Младшая заболела, монахов звали.","Детей кормить — хлеба не напасёшься.","Сорванцы на стену лазили!","Дочка песни поёт — заслушаешься.","Ради детей и живём."],none:["Один живу, тихо.","Жениться бы, да на что семью кормить.","Родня далеко, в других краях.","Сам себе хозяин.","Одному и ужинать скучно.","Невесту бы найти.","Без семьи и дом пустой.","Приехал{a} сюда {odinL}, так и живу.","Родители давно умерли.","Может, и мне пора семью заводить."],parents:["Старик совсем плох стал.","Мать всё молится за нас.","Отец учил меня ремеслу.","Родители стареют, а помочь нечем.","Мать пирог испекла, заходи.","Отец ворчит, что я мало работаю.","Старики наши — голова всему.","М  хожу.","Красивее тебя в {city} нет.","Моя мать хочет с тобой познакомиться.","Я на тебя в соборе смотрел.","Вечером у колодца буду ждать.","Ты как солнышко.","Давай встречаться, {name}.","Ради тебя я бы на дракона пошёл.","С тобой и зима не страшна.","Я серьёзно, {name}."],gs=["Ах, перестань…","Ну и выдумщик!","Может, и прогуляемся.","Мама не велит с тобой говорить.","Приходи вечером к колодцу.","Ты всем это говоришь?","Болтун ты, {name}.","Ладно, посмотрим.","А цветы где?","Я подумаю.","Не так быстро.","Говори, говори.","Красиво говоришь.","Отец тебя и на порог не пустит.","Мне нравится, как ты это говоришь.","Покраснела, да?","Хм, может быть.","Ты мне тоже нравишься.","Сначала дом построй.","Увидимся на празднике."],Il=["Моя {spouse} — лучшее, что со мной случилось.","Женат, и счастлив.","Свадьбу помню как вчера.","Поженились — и ни разу не пожалел{a}.","Муж говорит — я его счастье.","Семейная жизнь — это труд.","С {spouse} и беда не беда.","Детей бы ещё.","Годовщина скоро.","Сватались долго, а поженились быстро."],Ll=["Давай в догонялки!","А я видел в реке огромную рыбу!","Мама не разрешает к реке ходить.","У кузнеца искры летят — страшно!","Пошли на стену залезем!","Я вырасту и стану стражником!","А у меня зуб выпал!","Спорим, я быстрее добегу?","А ты видел дракона? Я видел!","Пекарь дал мне корочку!","Давай в прятки!","Я умею свистеть, слушай!","У меня братик родился!","Отец сказал, что я буду кузнецом.","А у стражника настоящий меч!","Пойдём лягушек ловить!","Я нашёл монетку!","Мне мама пирог испекла.","Бард рассказывал про великана!","В лесу живёт медведь, честно!","Я не боюсь темноты. Почти.","Давай построим крепость!","Моя сестра — ябеда.","Смотри, какой жук!","А я умею на дерево лазить!","Собака за мной бежала!","У нас дома котёнок.","Когда вырасту — куплю коня.","Я видел, как стражник вора поймал!","Побежали на площадь, там глашатай!"],Nl=["Давай!","Врёшь!","А я нет!","Я первый!","Не верю!","Покажи!","А мне мама не разрешает.","Здорово!","Ух ты!","Пошли!","Я тоже хочу!","Ябеда!"],ms=["Ты чего тут один, {name}?","Иди домой, мать ищет.","Расти большой, не будь лапшой.","Держи, малыш.","Не лезь на стену, упадёшь!","Чей ты, мальчик?","Отцу помогаешь?","Вырастешь — в цех возьму.","Не балуйся у реки.","Хочешь сказку?"],Pl=["Дяденька, а вы стражник?","А правда, что дракон был?","Мама дома!","Я не балуюсь!","Дайте корочку!","А вы кузнец? Покажите молот!","Я уже большой!","Я никуда не лезу!","Расскажите сказку!","А я видел вора!"],Fl=["В наше время молодёжь уважала старших.","Зима будет суровая, кости ноют.","Я ещё помню, как эту стену строили.","Раньше и хлеб был вкуснее.","Доживёшь до моих лет — поймёшь.","Старого лорда помню — строг был.","В молодости я за реку ходил.","Собор при мне достроили.","Молодёжь нынче не та.","Мы в ваши годы с рассвета работали.","Помню голодный год — вот где страх был.","Внуки выросли, а я всё тут.","Сиди со мной, расскажу.","Кто помнит старый мост? Я помню.","Время летит, как ласточка.","На лавке у ворот — лучшее место в городе.","Старые песни забыли, жаль.","Я ещё первого бургомистра знал.","Дожить бы до весны.","Главное в жизни — не спешить."],Yl=["Расскажи, дед.","Да, времена меняются.","Живи долго, {name}.","Мудрый ты человек.","Вот и мой отец так говорил.","А сейчас-то лучше, нет?","Расскажешь внукам.","Здоровья тебе."],Bl=["Говорят, под собором клад зарыт — ещё с тех пор, как город основали.","Слыхал про Чёрного Мельника? Молол по ночам, а муки никто не видел.","В лесу за рекой живёт старуха — к ней за травами ходят, да не все возвращаются.","Рассказывают, лорд однажды переоделся нищим и ходил по рынку.","Дед мой говорил: когда колокол сам звонит — быть беде.","За каменоломней пещера есть, а в ней — дракон спит. Тот самый.","Жил в {city} кузнец, что подковал самого чёрта. С тех пор у чёрта хромота.","Старый мост, говорят, строили на костях разбойников.","Однажды река ушла из берегов и унесла целую улицу — до сих пор камни на дне.","У ворот стоял стражник сорок лет и ни разу не уснул. Умер стоя.","Говорят, в колодце на площади живёт водяной — не пей после заката.","Был пекарь, что пёк хлеб из золота. Богачи ели, а бедные смотрели.","В подвале ратуши, говорят, дверь без ключа. Кто откроет — увидит будущее.","Белая дама ходит по стене в полнолуние — ищет своего жениха.","Старики говорят: первый снег выпадет на крышу собора — зима будет мягкой.","Мой прадед видел, как с неба упал камень — с тех пор тут каменоломня.","Рассказывают, бард проиграл голос в кости, а потом отыграл обратно.","Жил-был купец, что продал тень. Богател, богател, а тени нет — солнца боялся.","Монахи говорят: кто в праздник работает — у того топор сам из рук падает.","В трущобах, говорят, ходит вор, которого никто не видел. Может, и нет его.","Когда город основали, первый камень заложил простой каменщик, а не лорд.","Есть поверье: кто в день свадьбы увидит ворону — проживёт с женой до ста лет.","За рекой, говорят, деревня, где все говорят шёпотом — чтобы зверя не разбудить.","Говорят, собачий вой у замка — к смене лорда."],Ol=["Враки это всё.","А я верю.","Бабушка так же рассказывала.","Расскажи ещё!","Страшно-то как.","Поди проверь.","Хорошая сказка.","Это ты сам выдумал?","Детям расскажу.","Кто знает, кто знает…"],Xl=["Спрашивают пекаря: отчего хлеб чёрствый? А он: зато долго хранится!","Стражник вора поймал: «Ты зачем крал?» — «Так не давали же!»","Мельник говорит: у меня всё белое. Жена: кроме совести.","Кузнец жене: ты мне как наковальня. — Это как? — Всю жизнь бью, а ты ни с места!","Купец: «Товар бесплатный!» — «А это что?» — «А это плата за бесплатно.»","Священник: «Пьянство — грех!» Пьяница: «Так я ж каюсь каждое утро!»","Нищий: «Подайте на хлеб!» — «А вчера на эль просил.» — «Так закусить надо!»","Лорд: «Я вас всех кормлю!» Крестьянин: «А кто кормит вас, ваша милость?»","Жена мужу: «Опять из таверны?» — «Нет, в таверну. Просто домой зашёл.»","Стражник: «Кто идёт?» — «Свои!» — «Свои дома сидят!»","Бард спел лорду песню. Лорд: «Сколько тебе за неё?» — «Чтобы не пел — вдвое.»","Кожевник говорит: от меня пахнет деньгами. Соседи: тогда у тебя очень старые деньги.","Монах: «Пост — для души.» Нищий: «А у меня круглый год пост, а душа всё равно болит.»","Мясник взвешивает: «Полфунта.» — «А с пальцем?» — «Палец бесплатно.»","Плотник: «Стол прослужит сто лет!» — «А гарантия?» — «Приходите через сто лет.»","Каменщик: «Дом вечный!» Заказчик: «А крыша?» — «Крыша — к плотнику.»","Муж: «Я — голова семьи!» Жена: «А я шея. Куда поверну — туда и смотришь.»","Глашатай кричит: «Все на площадь!» — «Зачем?» — «Чтоб я не зря кричал!»","Бургомистр: «Налоги на благо города!» — «А город где?» — «В казне!»","Пекарь: «Хлеб свежий!» — «А вчерашний?» — «Тоже свежий. Вчера был.»","Крестьянин вола продал: «Умный был, пахал как человек.» — «Что ж продал?» — «Говорить начал.»","Стражника спрашивают: «Много воров поймал?» — «Одного. Себя в зеркале.»","Трактирщик: «Эль наш — вода!» — «Как вода?!» — «Прозрачный, как вода. И честный.»","Монах лечит: «Пей отвар три раза в день.» — «А поможет?» — «Три раза в день будешь думать, что поможет.»","Нищий нищему: «Плохо подают.» — «Так сезон такой.» — «Какой?» — «Все нищие.»","Вор: «Я честный вор! Краду только у богатых.» — «Почему?» — «У бедных нечего.»","Жена кузнеца: «Муж — золото!» — «Почему?» — «Весь день в огне, а не плавится.»","Лорд спрашивает: «Народ доволен?» — «Молчит.» — «Значит, доволен.» — «Или спит.»","Герольд читает указ: «Налог отменить!» Народ ликует. Герольд: «Ой, не ту бумагу взял.»","Священник: «На небесах нет таверн.» Пьяница: «Тогда зачем туда стремиться?»"],Gl=["Ха-ха-ха!","Ну ты даёшь!","Хорошая!","Ой, не могу!","Расскажу жене.","Слышал уже.","Ха! Смешно.","Так себе шутка.","Чуть не упал{a}!","Старая, но смешная.","Ты б в барды пошёл.","Ха-ха, точно!","Откуда ты их берёшь?","Умора.","Ещё одну!","Хе-хе."],ql=["Ты зачем вчера про меня болтал?","Это твоя свинья мой огород перерыла?","Долг когда вернёшь?","Чего уставился?","Опять ты мне дорогу перешёл!","Ты мне кружку в таверне разбил!","Твои дети мои окна
