ернова стёрлись, менять пора.","Мучная пыль — всё белое.","Пекарь ворчит, что мука сырая.","Крестьяне очередь к мельнице выстроили.","Мельник всегда в муке, как в снегу.","Без мельницы хлеба не будет.","Плотину бы подправить."],[w.Butcher]:["Свежая свинина, заходи.","Скот нынче тощий.","Нож наточил — режет как бритва.","Шкуры кожевнику отдал.","Мясо дорожает, а что делать.","Крестьяне скот не везут.","В жару мясо не лежит.","Колбасу новую сделал — попробуй.","Мясник без ножа — как стражник без алебарды.","Собаки у лавки крутятся."],[w.Burgomaster]:["Дела городские — одна головная боль.","Казна пустеет, а расходы растут.","Лорд требует отчёта.","Жалобы, жалобы, одни жалобы.","Суд вчера до ночи заседал.","Мост чинить надо, а денег нет.","Стражу содержать — целое состояние.","Город растёт, забот прибавляется.","Бургомистр — слуга города, не хозяин.","Купцы просят пошлины снизить."],[w.Herald]:["Слушайте, слушайте! Новости будут.","Голос сорвал на площади.","Указ оглашать — это тебе не песни петь.","Новый указ зачитывал — народ ворчал.","Глашатай всё знает первым.","Горло мёдом смазываю.","На площади с утра — кричу.","Если я молчу — значит, новостей нет.","Бургомистр бумагу дал — читать не разобрать.","Слушайте все!"],[w.Servant]:["Господа опять не в духе.","С утра до ночи на побегушках.","В замке полы мыть — дело неблагодарное.","Лорд гостей ждёт — всё вверх дном.","Жалованье платят, и на том спасибо.","Кухарка опять ругалась.","В замке тепло, не то что дома.","Слуга всё видит, да молчит.","Серебро чистить — руки отваливаются.","Госпожа платье новое велела шить."],[w.Laborer]:["Мешки таскаю, спина трещит.","Хоть какая работа — и то хлеб.","Нанялся на день, а завтра — как Бог даст.","На стройке платят, пока строят.","Подёнщик — ни дома, ни ремесла.","Взяли бы меня в цех.","Сегодня брёвна, завтра камни.","Работы много, да платят мало.","Руки есть — не пропадём.","Купец вчера нанимал — повезло."],[w.Beggar]:["Подайте, люди добрые…","С утра ни крошки во рту.","Был и я когда-то человеком.","Монетку, ради Бога.","Ночевал под мостом, холодно.","Стража гонит с площади.","Добрые люди ещё есть.","Хлеба бы корочку.","Был дом, был двор — всё сгорело.","Нищему и дождь — беда."],[w.Thief]:["Дела? Да так, кручусь.","Стража сегодня злая.","Не твоё дело, чем я занимаюсь.","Ночью спится плохо, хожу.","Деньги любят тишину.","У кого кошель тяжёлый, у того и забот больше.","Я человек честный, когда никто не видит.","Хм, у тебя кошель на виду.","Воров в городе нет — одни бедняки.","Что упало — то пропало."],[w.Noble]:["Эти простолюдины так шумят.","На охоте вчера подняли кабана.","При дворе скучно.","Моя родословная старше этого города.","Прислуга совсем обленилась.","Лорд обещал турнир.","Вино из-за реки — вот это вино.","Эта грязь на улицах невыносима.","Сокол мой лучший в округе.","Бал у лорда был недурён."],[w.Lord]:["Город должен платить вовремя.","Я слежу за порядком.","Стража распустилась.","Бургомистр опять с докладом.","Замок требует ремонта.","Подданные должны знать своё место.","Налоги — цена безопасности.","Праздник устрою — пусть народ помнит.","Соседний барон зарится на наши земли.","Тяжела рука, что держит город."],[w.Housewife]:["Дома дел — не переделать.","Дети совсем от рук отбились.","Хлеб опять подорожал.","Муж допоздна работает.","Стирка, готовка, уборка — и так каждый день.","Соседка новый платок купила.","Печь дымит, надо мужу сказать.","Малой заболел, всю ночь не спала.","На рынок сходила — всё дорого.","Дом держится на хозяйке."],[w.Bard]:["Сочинил новую балладу про дракона.","В таверне вчера пели до утра.","Хочешь, спою?","Струна лопнула — беда.","Песня про лорда ему не понравилась.","Народ любит грустные песни.","Голос — мой хлеб.","Бард без публики — как кузнец без наковальни.","Новую песню про {city} сложил.","За песню и накормят, и напоят."],[w.Stablehand]:["Лошадь лорда захромала.","Конюшню чистить — не сахар.","Овёс дорогой, кони голодные.","Жеребёнок родился — красавец.","Купцы коней меняют у нас.","Лошадь умнее иного !","Ух ты!","Пошли!","Я тоже хочу!","Ябеда!"],Ho=["Ты чего тут один, {name}?","Иди домой, мать ищет.","Расти большой, не будь лапшой.","Держи, малыш.","Не лезь на стену, упадёшь!","Чей ты, мальчик?","Отцу помогаешь?","Вырастешь — в цех возьму.","Не балуйся у реки.","Хочешь сказку?"],Cr=["Дяденька, а вы стражник?","А правда, что дракон был?","Мама дома!","Я не балуюсь!","Дайте корочку!","А вы кузнец? Покажите молот!","Я уже большой!","Я никуда не лезу!","Расскажите сказку!","А я видел вора!"],Dr=["В наше время молодёжь уважала старших.","Зима будет суровая, кости ноют.","Я ещё помню, как эту стену строили.","Раньше и хлеб был вкуснее.","Доживёшь до моих лет — поймёшь.","Старого лорда помню — строг был.","В молодости я за реку ходил.","Собор при мне достроили.","Молодёжь нынче не та.","Мы в ваши годы с рассвета работали.","Помню голодный год — вот где страх был.","Внуки выросли, а я всё тут.","Сиди со мной, расскажу.","Кто помнит старый мост? Я помню.","Время летит, как ласточка.","На лавке у ворот — лучшее место в городе.","Старые песни забыли, жаль.","Я ещё первого бургомистра знал.","Дожить бы до весны.","Главное в жизни — не спешить."],Tr=["Расскажи, дед.","Да, времена меняются.","Живи долго, {name}.","Мудрый ты человек.","Вот и мой отец так говорил.","А сейчас-то лучше, нет?","Расскажешь внукам.","Здоровья тебе."],zr=["Говорят, под собором клад зарыт — ещё с тех пор, как город основали.","Слыхал про Чёрного Мельника? Молол по ночам, а муки никто не видел.","В лесу за рекой живёт старуха — к ней за травами ходят, да не все возвращаются.","Рассказывают, лорд однажды переоделся нищим и ходил по рынку.","Дед мой говорил: когда колокол сам звонит — быть беде.","За каменоломней пещера есть, а в ней — дракон спит. Тот самый.","Жил в {city} кузнец, что подковал самого чёрта. С тех пор у чёрта хромота.","Старый мост, говорят, строили на костях разбойников.","Однажды река ушла из берегов и унесла целую улицу — до сих пор камни на дне.","У ворот стоял стражник сорок лет и н
