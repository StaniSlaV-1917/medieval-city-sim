о.","Воры совсем распоясались.","Капитан опять ругался.","Патрулирую, патрулирую — а толку.","Смотри у меня, чтоб без драк!"],[M.Merchant]:["Торговля идёт ни шатко ни валко.","Караван обещали на той неделе.","Пошлины душат, честное слово.","Покупатель нынче жадный.","Хороший товар сам себя хвалит."],[M.Innkeeper]:["Вчера в таверне яблоку негде было упасть.","Эль закончился — варю новый.","Пьяные — беда, но платят.","Заходи вечером, спою за кружкой."],[M.Priest]:["Паства нынче редко ходит в собор.","Молись, и воздастся.","Грехов в городе много, а кающихся мало.","На службу приходи, сын мой."],[M.Monk]:["В больнице опять двое с лихорадкой.","Травы собрал, настой готовлю.","Господь исцеляет, мы лишь помогаем."],[M.Carpenter]:["Доски сырые — крыша потечёт.","Заказали новую дверь для ратуши.","Плотник без топора — не плотник."],[M.Mason]:["Камень из каменоломни — отличный.","Стена у ворот трещину дала.","Кладка — дело неторопливое."],[M.Tanner]:["От кожевни запах — соседи ругаются.","Шкуры вымачиваю, работа грязная.","Зато сапоги у всех мои."],[M.Woodcutter]:["В лесу волки воют.","Сосну свалил — трое не обхватят.","Топор затупился, к кузнецу надо."],[M.Quarryman]:["В каменоломне пыль столбом.","Камень тяжёлый, а платят мало.","Чуть глыбой не придавило."],[M.Miller]:["Колесо крутится, мука сыплется.","Река обмелела — мельница еле тянет.","Зерно везут с полей, работы много."],[M.Butcher]:["Свежая свинина, заходи.","Скот нынче тощий.","Нож наточил — режет как бритва."],[M.Burgomaster]:["Дела городские — одна головная боль.","Казна пустеет, а расходы растут.","Лорд требует отчёта."],[M.Herald]:["Слушайте, слушайте! Новости будут.","Голос сорвал на площади.","Указ оглашать — это тебе не песни петь."],[M.Servant]:["Господа опять не в духе.","С утра до ночи на побегушках.","В замке полы мыть — дело неблагодарное."],[M.Laborer]:["Мешки таскаю, спина трещит.","Хоть какая работа — и то хлеб.","Нанялся на день, а завтра — как Бог даст."],[M.Beggar]:["Подайте, люди добрые…","С утра
