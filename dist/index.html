ись, и воздастся.","Грехов в городе много, а кающихся мало.","На службу приходи, сын мой."],[w.Monk]:["В больнице опять двое с лихорадкой.","Травы собрал, настой готовлю.","Господь исцеляет, мы лишь помогаем."],[w.Carpenter]:["Доски сырые — крыша потечёт.","Заказали новую дверь для ратуши.","Плотник без топора — не плотник."],[w.Mason]:["Камень из каменоломни — отличный.","Стена у ворот трещину дала.","Кладка — дело неторопливое."],[w.Tanner]:["От кожевни запах — соседи ругаются.","Шкуры вымачиваю, работа грязная.","Зато сапоги у всех мои."],[w.Woodcutter]:["В лесу волки воют.","Сосну свалил — трое не обхватят.","Топор затупился, к кузнецу надо."],[w.Quarryman]:["В каменоломне пыль столбом.","Камень тяжёлый, а платят мало.","Чуть глыбой не придавило."],[w.Miller]:["Колесо крутится, мука сыплется.","Река обмелела — мельница еле тянет.","Зерно везут с полей, работы много."],[w.Butcher]:["Свежая свинина, заходи.","Скот нынче тощий.","Нож наточил — режет как бритва."],[w.Burgomaster]:["Дела городские — одна головная боль.","Казна пустеет, а расходы растут.","Лорд требует отчёта."],[w.Herald]:["Слушайте, слушайте! Новости будут.","Голос сорвал на площади.","Указ оглашать — это тебе не песни петь."],[w.Servant]:["Господа опять не в духе.","С утра до ночи на побегушках.","В замке полы мыть — дело неблагодарное."],[w.Laborer]:["Мешки таскаю, спина трещит.","Хоть какая работа — и то хлеб.","Нанялся на день, а завтра — как Бог даст."],[w.Beggar]:["Подайте, люди добрые…","С утра ни крошки во рту.","Был и я когда-то человеком."],[w.Thief]:["Дела? Да так, кручусь.","Стража сегодня злая.","Не твоё дело, чем я занимаюсь."],[w.Noble]:["Эти простолюдины так шумят.","На охоте вчера подняли кабана.","При дворе скучно."],[w.Lord]:["Город должен платить вовремя.","Я слежу за порядком.","Стража распустилась."],[w.Housewife]:["Дома дел — не переделать.","Дети совсем от рук отбились.","Хлеб опять подорожал.","Муж допоздна работает."],[w.Bard]:["Сочинил новую балладу про дракона.","В таверн
