.","Хорошо бы дождик, поля сохнут.","Лето красное, а работы невпроворот.","В такую жару только в тени сидеть.","Вечером у реки прохладно."],[gt.Autumn]:["Листья желтеют, скоро холода.","Дожди зарядили, дороги раскисли.","Пора запасать дрова на зиму.","Урожай собрали — теперь можно и выдохнуть.","Осень, грибов в лесу — хоть косой коси.","Ветер какой — крыши сорвёт."],[gt.Winter]:["Мороз-то какой! Уши отваливаются.","Снега намело по самые окна.","Реку льдом сковало.","Дрова кончаются, а зима только началась.","В такой холод и волки к стенам подходят.","Скорей бы весна.","Печь топи не топи — всё одно холодно."]},Da={[b.Farmer]:["Поле вспахал, спина отваливается.","Если дождей не будет — пропадёт урожай.","Землю надо любить, тогда и родит.","В поле с рассвета до заката.","Лорд опять оброк поднял."],[b.Baker]:["С четырёх утра у печи стою.","Мука нынче дорогая.","Хлеб разобрали ещё до полудня!","Руки по локоть в тесте.","Пекарня — это не лавка, тут вставать затемно."],[b.Smith]:["Заказов — на месяц вперёд.","Уголь опять подорожал.","Выковал сегодня подкову — загляденье.","От горна спина не разгибается.","Стража просит новые алебарды."],[b.Guard]:["Ночью на восточной стене было тихо.","Воры совсем распоясались.","Капитан опять ругался.","Патрулирую, патрулирую — а толку.","Смотри у меня, чтоб без драк!"],[b.Merchant]:["Торговля идёт ни шатко ни валко.","Караван обещали на той неделе.","Пошлины душат, честное слово.","Покупатель нынче жадный.","Хороший товар сам себя хвалит."],[b.Innkeeper]:["Вчера в таверне яблоку негде было упасть.","Эль закончился — варю новый.","Пьяные — беда, но платят.","Заходи вечером, спою за кружкой."],[b.Priest]:["Паства нынче редко ходит в собор.","Молись, и воздастся.","Грехов в городе много, а кающихся мало.","На службу приходи, сын мой."],[b.Monk]:["В больнице опять двое с лихорадкой.","Травы собрал, настой готовлю.","Господь исцеляет, мы лишь помогаем."],[b.Carpenter]:["Доски сырые — крыша потечёт.","Заказали новую дверь для ратуши.","Плотник
