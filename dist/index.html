ый человек."],foe:["Опять ты…","Ну здравствуй, {name}.","Чего тебе?","Хм.","Не ожидал тебя тут встретить.","И тебе не хворать.","Ты ещё здесь?","Чего надо?","Говори быстрее, я спешу.","Ну?"],kid:["Привет! Пошли играть!","Эй, {name}!","Ты чего тут?","Айда на площадь!","Я первый добегу до колодца!","{name}, смотри, что у меня есть!","Привет! А тебя мама отпустила?","Эй! Догоняй!","{name}! Пошли к реке!","А я знаю секрет!","Привет-привет!","Чур, я водящий!"],morning:["Доброе утро!","С утречком!","Рано встал сегодня?","Доброе утро, {name}.","Ранняя пташка!","Утро доброе. Выспался?","С добрым утром, сосед.","Солнце только встало, а ты уже на ногах."],evening:["Добрый вечер.","Вечер добрый!","Уже темнеет, а ты всё ходишь.","Добрый вечер, {name}. Домой?","Поздновато гуляешь.","Вечер добрый. Фонарей бы побольше.","Темно уже, осторожней на улицах.","Добрый вечер. Ужинал?"],rain:["Промок до нитки, а ты?","Ну и льёт! Спрячемся под навес?","Здравствуй. Погодка — хоть не выходи.","Привет. Бежишь от дождя?","Доброго дня, если его можно назвать добрым.","Привет! Хоть бы переждать."],cold:["Здравствуй. Ну и морозище!","Привет, {name}. Замёрз{la} как собака.","Бр-р, здравствуй.","Доброго дня. Руки не чувствую.","Здорово. Холод-то какой!","Привет. Домой, к печке?"]},Ui={friend:["Ну, бывай! Заходи вечером.","Рад{a} был{a} повидать, {name}.","Береги себя!","До встречи, {friend}.","Ладно, {name}, ещё увидимся.","Передавай привет домашним!","Заглядывай, не чужие.","Ну, обнимемся — и по делам.","До завтра, {name}.","Не пропадай!","Бывай здоров, {name}.","Удачи тебе, {friend}."],neutral:["Ладно, пора мне.","Доброго дня.","Ну, бывай.","Дела ждут.","Увидимся.","Прощай.","Всего доброго.","Счастливо.","Ну, я пош{el}.","Пора, пора.","Хорошего дня.","Бог даст, свидимся."],foe:["Всё, некогда мне.","Ладно, ладно.","Не задерживаю.","Иди уже.","Разговор окончен.","Ну и ладно.","Отстань.","Прощай, и не попадайся."],kid:["Я домой, мама зовёт!","Пока! Завтра на площади!","Побежал! Догоняй!","Чур, завтр шься.","Сначала дом построй.","Увидимся на празднике."],cl=["Моя {spouse} — лучшее, что со мной случилось.","Женат, и счастлив.","Свадьбу помню как вчера.","Поженились — и ни разу не пожалел{a}.","Муж говорит — я его счастье.","Семейная жизнь — это труд.","С {spouse} и беда не беда.","Детей бы ещё.","Годовщина скоро.","Сватались долго, а поженились быстро."],fl=["Давай в догонялки!","А я видел в реке огромную рыбу!","Мама не разрешает к реке ходить.","У кузнеца искры летят — страшно!","Пошли на стену залезем!","Я вырасту и стану стражником!","А у меня зуб выпал!","Спорим, я быстрее добегу?","А ты видел дракона? Я видел!","Пекарь дал мне корочку!","Давай в прятки!","Я умею свистеть, слушай!","У меня братик родился!","Отец сказал, что я буду кузнецом.","А у стражника настоящий меч!","Пойдём лягушек ловить!","Я нашёл монетку!","Мне мама пирог испекла.","Бард рассказывал про великана!","В лесу живёт медведь, честно!","Я не боюсь темноты. Почти.","Давай построим крепость!","Моя сестра — ябеда.","Смотри, какой жук!","А я умею на дерево лазить!","Собака за мной бежала!","У нас дома котёнок.","Когда вырасту — куплю коня.","Я видел, как стражник вора поймал!","Побежали на площадь, там глашатай!"],dl=["Давай!","Врёшь!","А я нет!","Я первый!","Не верю!","Покажи!","А мне мама не разрешает.","Здорово!","Ух ты!","Пошли!","Я тоже хочу!","Ябеда!"],Zo=["Ты чего тут один, {name}?","Иди домой, мать ищет.","Расти большой, не будь лапшой.","Держи, малыш.","Не лезь на стену, упадёшь!","Чей ты, мальчик?","Отцу помогаешь?","Вырастешь — в цех возьму.","Не балуйся у реки.","Хочешь сказку?"],hl=["Дяденька, а вы стражник?","А правда, что дракон был?","Мама дома!","Я не балуюсь!","Дайте корочку!","А вы кузнец? Покажите молот!","Я уже большой!","Я никуда не лезу!","Расскажите сказку!","А я видел вора!"],ul=["В наше время молодёжь уважала старших.","Зима будет суровая, кости ноют.","Я ещё помню, как эту стену строили.","Раньше и хлеб был вкуснее.","Доживёшь до моих лет — поймёшь.","Старого лорда помню — строг был.","В молодости я за реку ходил.","Собор при мне достроили.","Молодёжь нынче не та.","Мы в ваши годы с рассвета работали.","Помню голодный год — вот где страх был.","Внуки выросли, а я всё тут.","Сиди со мной, расскажу.","Кто помнит старый мост? Я помню.","Время летит, как ласточка.","На лавке у ворот — лучшее место в городе.","Старые песни забыли, жаль.","Я ещё первого бургомистра знал.","Дожить бы до весны.","Главное в жизни — не спешить."],pl=["Расскажи, дед.","Да, времена меняются.","Живи долго, {name}.","Мудрый ты человек.","Вот и мой отец так говорил.","А сейчас-то лучше, нет?","Расскажешь внукам.","Здоровья тебе."],yl=["Говорят, под собором клад зарыт — ещё с тех пор, как город основали.","Слыхал про Чёрного Мельника? Молол по ночам, а муки никто не видел.","В лесу за рекой живёт старуха — к ней за травами ходят, да не все возвращаются.","Рассказывают, лорд однажды переоделся нищим и ходил по рынку.","Дед мой говорил: когда колокол сам звонит — быть беде.","За каменоломней пещера есть, а в ней — дракон спит. Тот самый.","Жил в {city} кузнец, что подковал самого чёрта. С тех пор у чёрта хромота.","Старый мост, говорят, строили на костях разбойников.","Однажды река ушла из берегов и унесла целую улицу — до сих пор камни на дне.","У ворот стоял стражник сорок лет и ни разу не уснул. Умер стоя.","Говорят, в колодце на площади живёт водяной — не пей после заката.","Был пекарь, что пёк хлеб из золота. Богачи ели, а бедные смотрели.","В подвале ратуши, говорят, дверь без ключа. Кто откроет — увидит будущее.","Белая дама ходит по стене в полнолуние — ищет своего жениха.","Старики говорят: первый снег выпадет на крышу собора — зима будет мягкой.","Мой прадед видел, как с неба упал камень — с тех пор тут каменоломня.","Рассказывают, бард проиграл голос в кости, а потом отыграл обратно.","Жил-был купец, что продал тень. Богател, богател, а тени нет — солнца боялся.","Монахи говорят: кто в праздник работает — у того топор сам из рук падает.","В трущобах, говорят, ходит вор, которого никто не видел. Может, и нет его.","Когда город основали, первый камень заложил простой каменщик, а не лорд.","Есть поверье: кто в день свадьбы увидит ворону — проживёт с женой до ста лет.","За рекой, говорят, деревня, где все говорят шёпотом — чтобы зверя не разбудить.","Говорят, собачий вой у замка — к смене лорда."],gl=["Враки это всё.","А я верю.","Бабушка так же рассказывала.","Расскажи ещё!","Страшно-то как.","Поди проверь.","Хорошая сказка.","Это ты сам выдумал?","Детям расскажу.","Кто знает, кто знает…"],ml=["Спрашивают пекаря: отчего хлеб чёрствый? А он: зато долго хранится!","Стражник вора поймал: «Ты зачем крал?» — «Так не давали же!»","Мельник говорит: у меня всё белое. Жена: кроме совести.","Кузнец жене: ты мне как наковальня. — Это как? — Всю жизнь бью, а ты ни с места!","Купец: «Товар бесплатный!» — «А это что?» — «А это плата за бесплатно.»","Священник: «Пьянство — грех!» Пьяница: «Так я ж каюсь каждое утро!»","Нищий: «Подайте на хлеб!» — «А вчера на эль просил.» — «Так закусить надо!»","Лорд: «Я вас всех кормлю!» Крестьянин: «А кто кормит вас, ваша милость?»","Жена мужу: «Опять из таверны?» — «Нет, в таверну. Просто домой зашёл.»","Стражник: «Кто идёт?» — «Свои!» — «Свои дома сидят!»","Бард спел лорду песню. Лорд: «Сколько тебе за неё?» — «Чтобы не пел — вдвое.»","Кожевник говорит: от меня пахнет деньгами. Соседи: тогда у тебя очень старые деньги.","Монах: «Пост — для души.» Нищий: «А у меня круглый год пост, а душа всё равно болит.»","Мясник взвешивает: «Полфунта.» — «А с пальцем?» — «Палец бесплатно.»","Плотник: «Стол прослужит сто лет!» — «А гарантия?» — «Приходите через сто лет.»","Каменщик: «Дом вечный!» Заказчик: «А крыша?» — «Крыша — к плотнику.»","Муж: «Я — голова семьи!» Жена: «А я шея. Куда поверну — туда и смотришь.»","Глашатай кричит: «Все на площадь!» — «Зачем?» — «Чтоб я не зря кричал!»","Бургомистр: «Налоги на благо города!» — «А город где?» — «В казне!»","Пекарь: «Хлеб свежий!» — «А вчерашний?» — «Тоже с
