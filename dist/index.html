","Пекарня — это не лавка, тут вставать затемно."],[m.Smith]:["Заказов — на месяц вперёд.","Уголь опять подорожал.","Выковал сегодня подкову — загляденье.","От горна спина не разгибается.","Стража просит новые алебарды."],[m.Guard]:["Ночью на восточной стене было тихо.","Воры совсем распоясались.","Капитан опять ругался.","Патрулирую, патрулирую — а толку.","Смотри у меня, чтоб без драк!"],[m.Merchant]:["Торговля идёт ни шатко ни валко.","Караван обещали на той неделе.","Пошлины душат, честное слово.","Покупатель нынче жадный.","Хороший товар сам себя хвалит."],[m.Innkeeper]:["Вчера в таверне яблоку негде было упасть.","Эль закончился — варю новый.","Пьяные — беда, но платят.","Заходи вечером, спою за кружкой."],[m.Priest]:["Паства нынче редко ходит в собор.","Молись, и воздастся.","Грехов в городе много, а кающихся мало.","На службу приходи, сын мой."],[m.Monk]:["В больнице опять двое с лихорадкой.","Травы собрал, настой готовлю.","Господь исцеляет, мы лишь помогаем."],[m.Carpenter]:["Доски сырые — крыша потечёт.","Заказали новую дверь для ратуши.","Плотник без топора — не плотник."],[m.Mason]:["Камень из каменоломни — отличный.","Стена у ворот трещину дала.","Кладка — дело неторопливое."],[m.Tanner]:["От кожевни запах — соседи ругаются.","Шкуры вымачиваю, работа грязная.","Зато сапоги у всех мои."],[m.Woodcutter]:["В лесу волки воют.","Сосну свалил — трое не обхватят.","Топор затупился, к кузнецу надо."],[m.Quarryman]:["В каменоломне пыль столбом.","Камень тяжёлый, а платят мало.","Чуть глыбой не придавило."],[m.Miller]:["Колесо крутится, мука сыплется.","Река обмелела — мельница еле тянет.","Зерно везут с полей, работы много."],[m.Butcher]:["Свежая свинина, заходи.","Скот нынче тощий.","Нож наточил — режет как бритва."],[m.Burgomaster]:["Дела городские — одна головная боль.","Казна пустеет, а расходы растут.","Лорд требует отчёта."],[m.Herald]:["Слушайте, слушайте! Новости будут.","Голос сорвал на площади.","Указ оглашать — это тебе не песни петь."],[m.Servant]:[
