е печёт — хоть в реку лезь.","Хорошо бы дождик, поля сохнут.","Лето красное, а работы невпроворот.","В такую жару только в тени сидеть.","Вечером у реки прохладно."],[nt.Autumn]:["Листья желтеют, скоро холода.","Дожди зарядили, дороги раскисли.","Пора запасать дрова на зиму.","Урожай собрали — теперь можно и выдохнуть.","Осень, грибов в лесу — хоть косой коси.","Ветер какой — крыши сорвёт."],[nt.Winter]:["Мороз-то какой! Уши отваливаются.","Снега намело по самые окна.","Реку льдом сковало.","Дрова кончаются, а зима только началась.","В такой холод и волки к стенам подходят.","Скорей бы весна.","Печь топи не топи — всё одно холодно."]},es={[S.Farmer]:["Поле вспахал, спина отваливается.","Если дождей не будет — пропадёт урожай.","Землю надо любить, тогда и родит.","В поле с рассвета до заката.","Лорд опять оброк поднял."],[S.Baker]:["С четырёх утра у печи стою.","Мука нынче дорогая.","Хлеб разобрали ещё до полудня!","Руки по локоть в тесте.","Пекарня — это не лавка, тут вставать затемно."],[S.Smith]:["Заказов — на месяц вперёд.","Уголь опять подорожал.","Выковал сегодня подкову — загляденье.","От горна спина не разгибается.","Стража просит новые алебарды."],[S.Guard]:["Ночью на восточной стене было тихо.","Воры совсем распоясались.","Капитан опять ругался.","Патрулирую, патрулирую — а толку.","Смотри у меня, чтоб без драк!"],[S.Merchant]:["Торговля идёт ни шатко ни валко.","Караван обещали на той неделе.","Пошлины душат, честное слово.","Покупатель нынче жадный.","Хороший товар сам себя хвалит."],[S.Innkeeper]:["Вчера в таверне яблоку негде было упасть.","Эль закончился — варю новый.","Пьяные — беда, но платят.","Заходи вечером, спою за кружкой."],[S.Priest]:["Паства нынче редко ходит в собор.","Молись, и воздастся.","Грехов в городе много, а кающихся мало.","На службу приходи, сын мой."],[S.Monk]:["В больнице опять двое с лихорадкой.","Травы собрал, настой готовлю.","Господь исцеляет, мы лишь помогаем."],[S.Carpenter]:["Доски сырые — крыша потечёт.","Заказали новую дверь для ратуши.","Плотник без топора — не плотник."],[S.Mason]:["Камень из каменоломни — отличный.","Стена у ворот трещину дала.","Кладка — дело неторопливое."],[S.Tanner]:["От кожевни запах — соседи ругаются.","Шкуры вымачиваю, работа грязная.","Зато сапоги у всех мои."],[S.Woodcutter]:["В лесу волки воют.","Сосну свалил — трое не обхватят.","Топор затупился, к кузнецу надо."],[S.Quarryman]:["В каменоломне пыль столбом.","Камень тяжёлый, а платят мало.","Чуть глыбой не придавило."],[S.Miller]:["Колесо крутится, мука сыплется.","Река обмелела — мельница еле тянет.","Зерно везут с полей, работы много."],[S.Butcher]:["Свежая свинина, заходи.","Скот нынче тощий.","Нож наточил — режет как бритва."],[S.Burgomaster]:["Дела городские — одна головная боль.","Казна пустеет, а расходы растут.","Лорд требует отчёта."],[S.Herald]:["Слушайте, слушайте! Новости будут.","Голос сорвал на площади.","Указ оглашать — это тебе не песни петь."],[S.Servant]:["Господа опять не в духе.","С утра до ночи на побегушках.","В замке полы мыть — дело неблагодарное."],[S.Laborer]:["Мешки таскаю, спина трещит.","Хоть какая работа — и то хлеб.","Нанялся на день, а завтра — как Бог даст."],[S.Beggar]:["Подайте, люди добрые…","С утра ни крошки во рту.","Был и я когда-то человеком."],[S.Thief]:["Дела? Да так, кручусь.","Стража сегодня злая.","Не твоё дело, чем я занимаюсь."],[S.Noble]:["Эти простолюдины так шумят.","На охоте вчера подняли кабана.","При дворе скучно."],[S.Lord]:["Город должен платить вовремя.","Я слежу за порядком.","Стража распустилась."],[S.Housewife]:["Дома дел — не переделать.","Дети совсем от рук отбились.","Хлеб опять подорожал.","Муж допоздна работает."],[S.Bard]:["Сочинил новую балладу про дракона.","В таверне вчера пели до утра.","Хочешь, спою?"],[S.Stablehand]:["Лошадь лорда захромала.","Конюшню чистить — не сахар."],[S.Fireman]:["Проверяй печь, а то сгорим все.","Вёдра на каланче полны."]},is=["Работа — не волк, но и не убежит.","Устал как собака.","Дела идут помаленьку.","Р
